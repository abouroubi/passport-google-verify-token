name: Build, tag, release and publish

on:
  push:
    branches: [master]

env:
  NODE_VERSION: 24.x

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'ci: version bump to')"
    uses: ./.github/workflows/test.yml

  bump:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.newTag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Major for `type!:` or "BREAKING CHANGE" commits, minor for `feat`, patch otherwise.
      - id: bump
        uses: phips28/gh-action-bump-version@v11.0.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-prefix: v

  # Publishing happens here rather than in a workflow triggered by the release:
  # events caused by GITHUB_TOKEN never start other workflows.
  publish:
    needs: [bump]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      # npm trusted publishing (OIDC), configured for this workflow file on npmjs.com.
      - run: npm publish --provenance --access public

  release:
    needs: [bump, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          generate_release_notes: true
